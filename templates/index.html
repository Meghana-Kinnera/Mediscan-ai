<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediScan AI – Smart Medical Report Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans antialiased">
    <div class="min-h-screen flex items-center justify-center px-4 py-10">
        <div class="w-full max-w-4xl bg-white rounded-3xl shadow-xl p-10">
            <!-- Title -->
            <div class="mb-8 text-center">
                <h1 class="text-4xl font-bold text-indigo-700">MediScan AI</h1>
                <p class="text-gray-600 mt-2 text-lg">Smart Medical Report Analyzer</p>
            </div>

            <!-- File Upload Form -->
            <form method="POST" enctype="multipart/form-data" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2" for="report">Upload your medical report (.txt, .docx)</label>
                    <input 
                        type="file" 
                        name="report" 
                        accept=".txt,.docx,.doc" 
                        required
                        class="block w-full px-4 py-3 text-sm text-gray-700 bg-gray-100 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
                    >
                </div>
                <div>
                    <button 
                        type="submit" 
                        class="w-full bg-indigo-600 text-white font-semibold py-3 px-6 rounded-lg hover:bg-indigo-700 transition duration-300 shadow-md cursor-pointer"
                    >
                        Analyze Report
                    </button>
                </div>
            </form> 

            <!-- Error Message -->
            {% if error %}
                <div class="mt-6 p-4 bg-red-50 border border-red-200 rounded-lg">
                    <p class="text-red-600 font-medium text-center">{{ error }}</p>
                </div>
            {% endif %}

            <!-- Final Diagnosis Section -->
            {% if diagnosis %}
                <div class="mt-10">
                    <h3 class="text-2xl font-semibold text-indigo-800 mb-4">Final Diagnosis</h3>
                    <div class="bg-indigo-50/50 border border-indigo-200 rounded-lg p-6 shadow-inner text-gray-800 space-y-3 leading-relaxed text-base whitespace-pre-wrap">
{{ diagnosis }}
                    </div>
                </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
